function headerStatus(){return `<div class="statusbox ${d().forecast==='needs'?'warn':''}"><div class="sicon">${d().forecast==='needs'?'!':'✓'}</div><div style="flex:1"><strong>${d().forecast==='needs'?'Future outlook needs a review':'Future outlook is partially modeled'}</strong><p>${d().forecast==='needs'?'Your current finances are still available. Forecast setup and long-term tax coverage need attention.':'Illustrative preview only — no live financial engine is connected to this prototype.'}</p></div><button class="actionlink" data-nav="plan">Review →</button></div>`}
function overview(){let p=d(),o=isO();return head('YOUR STARTING POINT',o?'A clearer picture of your future.':'Know where you stand.',`A simple starting point for ${p.name}. Focus on what matters, then build a plan at your pace.`,btn('Explore your plan →','go-plan','primary'))+`<div class="metrics">${metric(o?'Household net worth':'Cash & savings',money(o?p.networth:p.cash),o?'Includes home equity; not all available to spend.':'Checking, savings and recorded cash · known facts','KNOWN')}${metric(o?'Investable assets':'Outstanding debt',money(o?p.invest:p.debt),o?'Across multiple accounts, not all immediately accessible.':'Mortgage, car, card and promotional balances','SOURCED')}${metric(o?'Recurring care expense':'Investment accounts',o?money(p.care)+'/mo':'None recorded',o?'Support for Avery · expense, not assumed public benefits.':'No accounts is a valid starting point','VIEW')}</div><div class="grid2"><div class="colstack"><div class="panel"><div class="panelhead"><div><h2>Where should we start?</h2><p>Choose a question. We’ll take you to the right place.</p></div></div>${item('◫',o?'What can we sustainably spend?':'Where does my monthly money go?',o?'Compare recorded income, care needs and expenses.':'Understand income, spending, and payments.',null,'go-money')}${item('▣',o?'How much is accessible?':'What do I actually owe?',o?'Separate liquid money, investments and home equity.':'See the mortgage, vehicle loan and credit card.',null,'go-networth')}${item('◴',o?'What if we retire at different ages?':'Can I start saving for retirement?',o?'See retirement assumptions for each adult.':'Explore the future without needing an investment account.',null,'go-plan')}</div><div class="panel"><div class="panelhead"><div><h2>Current position, explained</h2><p>Recorded financial categories. No future assumptions mixed in.</p></div>${tag('KNOWN VALUES')}</div>${o?`<div class="barrow"><span class="name">Investments</span><div class="barouter"><div class="barfill" style="width:77%"></div></div><span class="v">$3.93m</span></div><div class="barrow"><span class="name">Home</span><div class="barouter"><div class="barfill pale" style="width:27%"></div></div><span class="v">$1.35m</span></div><div class="barrow"><span class="name">Mortgage</span><div class="barouter"><div class="barfill sand" style="width:6%"></div></div><span class="v">$280k</span></div>`:`<div class="barrow"><span class="name">Home</span><div class="barouter"><div class="barfill" style="width:96%"></div></div><span class="v">$288k</span></div><div class="barrow"><span class="name">Debts</span><div class="barouter"><div class="barfill sand" style="width:81%"></div></div><span class="v">$243.8k</span></div><div class="barrow"><span class="name">Cash</span><div class="barouter"><div class="barfill pale" style="width:8%"></div></div><span class="v">$3,950</span></div>`}<div class="footnote">Only recorded components in this fictional example. Bars compare approximate sizes—not spending availability or modeled future returns.</div></div></div><div class="colstack">${headerStatus()}<div class="panel"><div class="panelhead"><div><h2>Your planning starting points</h2><p>Suggestions you can change; not statements of fact.</p></div></div>${item('◴','Forecast through age '+p.end,'Visible, editable planning horizon',null,'go-plan')}${item('↗','Retirement age '+p.retirement,o?'Marisol; James has a separate age.':'Editable assumption, not a benefit claiming age.',null,'edit-plan')}${item('◇','Know what is included','View sources and limitations',null,'go-sources')}</div></div></div>`}
function moneyView(){let p=d();return head('YOUR MONTHLY MONEY','See how money moves.',`Separate recorded income from actual deposits, spending and transfers. We won’t guess your take-home pay.`,btn('Review income','edit-income','primary'))+`<div class="grid2"><div class="colstack"><div class="panel"><div class="panelhead"><div><h2>Monthly cash flow</h2><p>${p.sourceDate} · Synthetic sources · Not yet reconciled</p></div>${tag('INCOMPLETE','gray')}</div><div class="statusbox warn"><span class="sicon">!</span><div><strong>Take-home pay is not verified</strong><p>Gross wages don’t equal deposits. Add withholding or bank posting evidence to calculate an accurate monthly surplus.</p></div><button class="actionlink" data-action="edit-income">Fix →</button></div>${item('↗','Gross salary',isO()?'Two incomes combined, before payroll withholding.':'Base pay before withholding; excludes some overtime.',money(p.earning/12)+'/mo','edit-income')}${item('◦','Actual take-home deposits','Needs supporting bank/payroll evidence','Unknown','edit-income')}${item('▤','Discretionary spending',p.spend===null?'Not yet recorded for this demo.':'Illustrative entered amount · editable',p.spend===null?'Missing':money(p.spend)+'/mo','edit-spend')}${item('▣','Debt payments','See loan schedules and funding source','See details','go-networth')}${isO()?item('♡','Avery care', 'Recurring parent-funded expense · not a benefit',money(p.care)+'/mo','edit-care'):item('⇄','Sibling support transfer','A bank transfer, not ordinary spending','$100/mo','go-sources')}<div class="footnote">The application would derive a monthly surplus only when deposits and spending are sufficiently reconciled. This static prototype does not calculate financial outcomes.</div></div></div><div class="colstack"><div class="panel"><h2 style="margin-bottom:9px">A useful next step</h2><p class="lede">${isO()?'Confirm who pays care expenses and what coverage is known before projecting retirement.':'Verify monthly deposits and bills, then see whether a debt payoff or first retirement contribution fits.'}</p><div class="callout"><div><h3>Review one source</h3><p>Editing opens the same owner, wherever you start.</p></div>${btn('Go to source →','go-sources','soft')}</div></div><div class="panel"><h2 style="margin-bottom:13px">Accounting, without jargon</h2>${item('✓','A transfer is not new income','Moving money between accounts does not increase wealth.',null,'go-sources')}${item('✓','Loan principal is not consumption','Debt service uses cash but reduces a liability.',null,'go-networth')}</div></div></div>`}
function networthView(){let p=d();return head('ASSETS & OBLIGATIONS','What you own. What you owe.',`Account balances and contractual debts remain separate from future investment assumptions.`,btn('Review debt details','edit-debt','primary'))+`<div class="metrics">${metric('Home market value',money(p.home),'Source: illustrative property valuation','ASSET')}${metric('Outstanding loan balances',money(p.debt),'Contractual obligations and debt','DEBT')}${metric('Cash & savings',money(p.cash),'Liquid balances, not home equity','CASH')}</div><div class="grid2"><div class="panel"><div class="panelhead"><div><h2>Recorded obligations</h2><p>Tap a debt to see the source and applicable terms.</p></div></div>${item('⌂','Home mortgage',isO()?'3.45% fixed · 7 years left':'5.1% fixed · 21 years left',money(p.mortgage),'edit-debt')}${!isO()?item('▤','Credit card','25% APR · high-interest borrowing',money(p.card),'edit-card'):''}${!isO()?item('▣','Vehicle loan','Used pickup · 9.2% APR',money(p.auto),'edit-debt'):''}${!isO()?item('▣','Promotional financing','Zero percent ends June 2027','$1,200','go-sources'):''}</div><div class="colstack"><div class="panel"><h2 style="margin-bottom:11px">Assets aren’t all spendable</h2><p class="lede">Your home’s value, investment balances, and available cash represent different things.</p><div class="callout"><div><h3>Explore a choice</h3><p>Changes to a hypothetical plan do not rewrite your actual loan.</p></div>${btn('What if?','go-compare','soft')}</div></div><div class="panel"><h2 style="margin-bottom:10px">Source ownership</h2><p class="small muted">Mortgage contract: Net Worth → Debt. Checking/savings balances: Money → Accounts. The same editor is reused when you arrive from a summary or warning.</p></div></div></div>`}
function investingView(){const p=d();return head('INVESTMENTS & RETIREMENT','Build at your own pace.',`Review the accounts that actually exist, without requiring an investment account to use the app.`,btn(isO()?'Review retirement ages':'Explore a first step',isO()?'go-plan':'open-first','primary'))+(isO()?`<div class="metrics">${metric('Traditional 401(k) balances','$2,550,000','Marisol $1.45m · James $1.10m','OWNED')}${metric('Traditional IRAs','$580,000','Separate owners and tax character','SOURCED')}${metric('Roth IRAs','$410,000','Separate Roth accounts','SOURCED')}</div><div class="grid2"><div class="panel"><div class="panelhead"><div><h2>Retirement & brokerage accounts</h2><p>Manage on the owning account; no duplicate global input.</p></div></div>${item('◈','Marisol · 401(k)','Traditional retirement plan','$1,450,000','open-401k')}${item('◈','James · 401(k)','Separate employer and plan terms','$1,100,000','open-401k')}${item('↗','Taxable brokerage','Joint household ownership','$270,000','go-sources')}</div><div class="panel"><h2>Planning is separate from transactions</h2><p class="lede">A forecast can evaluate retirement choices, but it cannot invent distributions, plan rules or eligibility.</p><div class="callout"><div><h3>Different retirement dates</h3><p>Edit Marisol and James separately.</p></div>${btn('Review plan','go-plan','soft')}</div></div></div>`:`<div class="grid2"><div class="panel"><div class="empty"><div class="glyph">◈</div><h3>No investment accounts recorded</h3><p>That is completely fine. You can still understand debt, spending and savings before deciding whether to invest.</p>${btn('Explore a workplace contribution','open-first','primary')}</div><div class="footnote">Rick's employer offers a plan, but he is not enrolled. An employer match is not presumed to be earned, and workplace deductions must be modeled through payroll.</div></div><div class="panel"><h2 style="margin-bottom:10px">A simpler way to start</h2>${item('1','Make room in the budget','Check actual take-home pay and obligations.',null,'go-money')}${item('2','Understand expensive debt','Review the credit-card APR and payments.',null,'go-networth')}${item('3','Learn about workplace saving','Confirm plan terms and payroll eligibility.',null,'open-first')}</div></div>`)}
function planView(){let p=d(),older=p.age;let years=Math.max(0,p.end-older);let longer=years>40;const retirementLine=isO()?`<div class="inputrow"><div><strong>Marisol · retirement age</strong><p>Planning assumption, separate from benefits</p></div><button class="forminput" data-action="edit-plan">${p.retirement} &nbsp; ✎</button></div><div class="inputrow"><div><strong>James · retirement age</strong><p>Independent event and income binding</p></div><button class="forminput" data-action="edit-plan">${p.retirement2} &nbsp; ✎</button></div>`:`<div class="inputrow"><div><strong>Rick · retirement age</strong><p>Working assumption · not Social Security claiming</p></div><button class="forminput" data-action="edit-plan">${p.retirement} &nbsp; ✎</button></div>`;return head('PLAN → CURRENT PLAN','Look ahead with confidence.',`Your horizon and retirement ages are easy to adjust. Calculations must disclose what they can—and cannot—model.`,btn('Review planning ages','edit-plan','primary'))+`<div class="grid2"><div class="colstack"><div class="panel"><div class="panelhead"><div><h2>Your planning timeline</h2><p>Suggested end at age 90 · editable · not a death date</p></div>${tag('EDITABLE')}</div><div class="one-line"><span class="muted small">Today · age ${older}</span><strong style="font-size:14px">Through age ${p.end}</strong></div><div class="planbar"></div><div class="planlabels"><span>2026 · starting position</span><span>Retirement ${p.retirement}</span><span>Ending age ${p.end}</span></div><div class="inputrow" style="margin-top:20px"><div><strong>Forecast end age</strong><p>${years} approximate years from the reference adult's current age</p></div><button class="forminput" data-action="edit-plan">${p.end} &nbsp; ✎</button></div>${retirementLine}<div class="footnote">${isO()?"For two selected spouses, the end is the later of their age-90 birthdays. Avery’s care may continue beyond that date; extend deliberately.":"Age 90 is an editable cutoff, not a presumed death date. Retirement age 65 does not mean Social Security benefits start at 65."}</div></div><div class="panel"><div class="panelhead"><div><h2>Illustrative assumptions</h2><p>Planning suggestions, not facts about your returns or salary.</p></div><button class="actionlink" data-action="edit-assumptions">Edit all →</button></div><div class="twocolfacts"><div class="fact"><span>Price growth · nominal</span><b>2.5% / year</b></div><div class="fact"><span>Salary growth · nominal</span><b>3.0% / year</b></div><div class="fact"><span>Generic portfolio return · nominal</span><b>5.0% / year</b></div><div class="fact"><span>Reserve goal</span><b>6 months</b></div></div><div class="footnote">Suggestions do not override authoritative salary, investment contract, tax, Social Security or healthcare facts.</div></div></div><div class="colstack"><div class="panel"><div class="panelhead"><div><h2>Forecast readiness</h2><p>Truthful coverage, without repetitive diagnostics.</p></div></div><div class="statusbox warn"><span class="sicon">!</span><div><strong>${longer?'Requested horizon exceeds current 40-year setup limit':'Not all future outcomes are supported'}</strong><p>${longer?`Age ${p.end} means approximately ${years} years. Existing authoring cannot execute this entire request today.`:'Future-year tax, benefit and healthcare coverage remains conditional on engine support.'}</p></div></div>${isO()?`<div class="statusbox warn"><span class="sicon">↗</span><div><strong>Avery’s care may extend beyond this horizon</strong><p>Care does not end automatically when either parent reaches 90; public benefits cannot be invented.</p></div></div>`:''}${btn(st.running?'Running…':d().forecast==='partial'?'Run illustrative preview again':'See forecast coverage','run-forecast','primary')}${st.running?btn('Cancel run','cancel-forecast') : ''}<div class="footnote">The prototype demonstrates lifecycle and coverage states; it does not compute a financial forecast or ignore unsupported future periods.</div></div><div class="panel"><h2 style="margin-bottom:11px">${d().forecast==='partial'?'Preview: partially modeled':'What could change your outcome?'}</h2><p class="lede">${isO()?'Independent retirement ages, insurance transitions, dependent-care costs and survivor benefits.':'Current spending, expensive debt, workplace plan enrollment, and the start of retirement.'}</p><div class="callout"><div><h3>No false precision</h3><p>Unsupported results remain explicitly uncomputed.</p></div>${btn('Compare choices','go-compare','soft')}</div></div></div></div>`}
function compareView(){let p=d(),o=isO();const choices=o?[['earlier','Retire at 62','Both adults choose earlier retirement; healthcare transitions matter.'],['split','Different retirement dates','Marisol 62, James 67; distinct pay and benefits.'],['care','Higher care funding','Avery’s additional future support; material law gaps.']]:[['spending','Reduce lifestyle spending','Explore a $250/month future reduction; recorded history unchanged.'],['debt','Pay down expensive debt','Explore repaying the card first; funding must be valid.'],['saving','Start a workplace contribution','Requires payroll, enrollment and employer plan terms.']];return head('PLAN → COMPARE','Better decisions, clear tradeoffs.',`Explore alternatives without modifying the real household facts or claiming unsupported financial outcomes.`,btn('Review your plan','go-plan','primary'))+`<div class="grid2"><div class="colstack"><div class="panel"><div class="panelhead"><div><h2>Choose one possible change</h2><p>The baseline remains unchanged. Select an illustrative future decision.</p></div>${tag('PROTOTYPE ONLY','gray')}</div><div class="choicegrid">${choices.map(([k,t,desc])=>`<button class="choice ${p.option===k?'selected':''}" data-option="${k}"><div class="radio">${p.option===k?'◉ SELECTED':'○ OPTION'}</div><h3>${t}</h3><p>${desc}</p></button>`).join('')}</div></div><div class="panel"><div class="panelhead"><div><h2>Comparison preview</h2><p>Two independent plan identities would be required.</p></div></div><div class="twocolfacts"><div class="fact"><span>Original plan</span><b>Baseline</b></div><div class="fact"><span>Selected alternative</span><b>${choices.find(z=>z[0]===p.option)[1]}</b></div></div><div class="statusbox warn" style="margin-top:16px"><span class="sicon">!</span><div><strong>Numeric plan comparison is not calculated here</strong><p>Issue #105 must supply independently saved alternatives and compatible Forecast Basis. Without those, showing a dollar delta or ranking would be misleading.</p></div></div>${btn('Show what would change','option-details','soft')}<div class="footnote">The interaction is clickable to review decisions and recovery, but this design prototype does not execute portfolio transactions or persist a real alternative.</div></div></div><div class="colstack"><div class="panel"><h2 style="margin-bottom:11px">How to interpret tradeoffs</h2>${item('◇','Cash available to spend','Known and modeled cash differ from net worth.',null,'go-money')}${item('▣','Debt and funding','Principal reduces debt; payments use cash.',null,'go-networth')}${item('◴','Retirement confidence','After-tax, healthcare and benefit gaps must be disclosed.',null,'go-plan')}</div></div></div>`}
function sourcesView(){let p=d(),o=isO();return head('SETTINGS → HOUSEHOLD & SOURCES','Know where each number comes from.',`One named source and one natural editing place for every recorded fact. No repeat entry across screens.`,btn('Review forecast gaps','go-plan','primary'))+`<div class="grid2"><div class="panel"><div class="panelhead"><div><h2>People & ownership</h2><p>Only sourced economic ownership is counted.</p></div></div>${o?item('◇','Marisol Ortega · 60','Planning adult · income and retirement plan',null,'edit-plan')+item('◇','James Ortega · 61','Planning adult · separate plan and earnings',null,'edit-plan')+item('♡','Avery Ortega · 29','Adult dependent · assets not presumed parental',null,'edit-care'):item('◇','Rick Barlow · 45','Single household member · no accounts invented',null,'edit-plan')}<div class="separator"></div><h3 style="margin-bottom:8px">Provenance & corrections</h3><p class="small muted">Recorded facts remain in their owner editors. A summary can open that editor in context, then return you to the question you were investigating.</p></div><div class="colstack"><div class="panel"><h2 style="margin-bottom:13px">Coverage notes</h2><div class="statusbox"><span class="sicon">✓</span><div><strong>Current recorded balance categories</strong><p>Known data from the fictional source blueprint, not a live account.</p></div></div><div class="statusbox warn"><span class="sicon">!</span><div><strong>Annual tax and long-run eligibility</strong><p>Dates, filing status and benefit rules cannot be carried forward automatically.</p></div></div><div class="statusbox warn"><span class="sicon">!</span><div><strong>${o?'Dependent-care and survivor rules':'Employer contribution eligibility'}</strong><p>Missing authority must be resolved or outcomes qualified—not filled with averages.</p></div></div></div><div class="panel"><h2 style="margin-bottom:10px">Import & storage</h2><p class="lede">No institutions are connected. Imported candidates would require a source review before creating or changing a recorded fact.</p><div style="margin-top:15px">${btn('Try import recovery','open-import','soft')}</div></div></div></div>`}
function saveView(){let p=d();return head('SETTINGS → SAVE & RETURN','Keep your work in context.',`This is a standalone prototype: it stores nothing permanently. Production persistence will follow the approved storage contract.`,btn('Mark demo as reviewed','save-session','primary'))+`<div class="grid2"><div class="panel"><div class="panelhead"><div><h2>Current session</h2><p>Fictional preview · ${p.name}</p></div>${tag(p.saved?'REVIEWED IN SESSION':'SESSION ONLY',p.saved?'':'gray')}</div>${item('▤','Session edits','Values change in the mock only; refresh discards them',p.changed?'Modified':'Unchanged','go-plan')}${item('◴','Current plan','Ending age '+p.end+' · retirement '+p.retirement,null,'go-plan')}${item('⇄','Selected choice','Not a persisted independent plan',null,'go-compare')}<div class="statusbox warn" style="margin-top:14px"><span class="sicon">!</span><div><strong>Not a real save</strong><p>Clicking “Mark demo as reviewed” only changes an in-memory label. Refresh closes all changes. No local browser persistence or cloud storage is used.</p></div></div></div><div class="panel"><h2>Return safely</h2><p class="lede" style="margin-bottom:17px">Switching between fictional households retains each one’s current session edits until page reload.</p>${btn('Switch to other household','switch-persona','soft')}<div class="separator"></div><p class="small muted">In the production app, switching with unsaved edits must offer a clear Save / Discard / Cancel decision and protect verified model data.</p>${btn('Try a destructive-action guard','open-reset')}</div></div>`}
function render(){nav();$('screen').innerHTML=({overview,money:moneyView,networth:networthView,investing:investingView,plan:planView,compare:compareView,sources:sourcesView,save:saveView}[st.view]||overview)();document.body.dataset.theme=st.theme;$('drawerRoot').innerHTML='';}
function go(k){st.view=k;st.drawer=null;render();window.scrollTo({top:0,behavior:'instant'});}function toast(t){$('toastRoot').innerHTML=`<div role="status" class="toast">${t}</div>`;clearTimeout(st.toastTimer);st.toastTimer=setTimeout(()=>$('toastRoot').innerHTML='',4200)};
function drawer(spec){priorFocus=document.activeElement;st.drawer=spec;const p=d();let title='',desc='',fields='',info='',submit='Save change';const field=(id,label,value,detail,min=0,max=99999999)=>`<label class="f-label" for="f-${id}">${label}</label><input id="f-${id}" name="${id}" type="number" inputmode="decimal" min="${min}" max="${max}" class="forminput" value="${value===null?'':value}" placeholder="Unknown"/><p class="f-description">${detail}</p>`;
if(spec==='nav'){title='All financial sections';desc='Choose a destination. Your current task remains available.';fields='<div class="nav" style="gap:9px">'+[...routes,['sources','People & sources'],['save','Save & return']].map(([k,l])=>'<button type="button" class="btn" data-nav="'+k+'" style="justify-content:flex-start;width:100%">'+icons[k]+' &nbsp; '+l+'</button>').join('')+'</div>';info='All financial sections are available on mobile. Each fact still has one authoritative editor.';submit='Close menu'}else if(spec==='plan'){title='Edit planning ages';desc='Plan → Current Plan and Life Events · separate sources';fields=field('end','Forecast ending age',p.end,'Editable age (up or down). It is a cutoff, not assumed death.',p.age+1,125)+field('ret',''+(isO()?'Marisol':'Rick')+' retirement age',p.retirement,'Illustrative future decision, not Social Security claiming.',p.age+1,100)+(isO()?field('ret2','James retirement age',p.retirement2,'Independent from Marisol. No automatic benefit eligibility.',p.otherAge+1,100):'');info=`For ${p.name}, longer forecasts may exceed current execution limits. The proposed age is never silently truncated.`}
else if(spec==='income'){title='Review income source';desc='Money → Income · authoritative salary editor';fields=field('earning','Annual gross salary',p.earning,'Illustrative recorded gross pay. Actual deposits require payroll and bank evidence.',0,2000000);info='Changing salary does not generate tax withholding, net pay or employer retirement eligibility.'}
else if(spec==='spend'){title='Edit spending source';desc='Money → Spending · actual recurring amount';fields=field('spend','Discretionary spending / month',p.spend,'Only enter a known amount. For a hypothetical reduction, use a separate plan option.',0,500000);info='Unknown is not zero. Saving a blank value preserves missing status.'}
else if(spec==='care'){title='Review care expenses';desc='Money → Spending · payer and supported adult';fields=field('care','Avery care costs / month',p.care,'Parent-funded support expense. Never assume public eligibility or trust outcomes.',0,500000);info='Care spending and separate legal ownership remain independent.'}
else if(spec==='card'){title='Review credit card';desc='Net Worth → Debt · recorded liability';fields=field('card','Card balance',p.card,'Existing balance, not a hypothetical payoff instruction.',0,2000000);info='25% APR is an example card term; modifying the balance does not execute a payment.'}
else if(spec==='debt'){title='Review mortgage source';desc='Net Worth → Debt · contractual obligation';fields=field('mortgage','Current mortgage balance',p.mortgage,'Recorded current balance; not original principal and not home equity.',0,10000000);info='A loan payoff scenario belongs to an independent plan, not a change to this recorded contract.'}
else if(spec==='assumptions'){title='Planning assumptions';desc='Plan → Assumptions · mock suggestions';fields=field('infl','General price growth (%)',2.5,'Nominal illustrative value, not actual CPI or tax law.',0,50)+field('wage','Annual pay growth (%)',3,'Nominal illustrative value; sourced salary contract takes precedence.',0,50)+field('return','Generic portfolio return (%)',5,'Not a guaranteed or observed return.',-50,100)+field('reserve','Emergency reserve target (months)',6,'A goal, not an actual cash balance.',0,60);info='These starter inputs can be changed or omitted. This prototype does not calculate economic consequences.'}
else if(spec==='first'){title='A first workplace contribution';desc='Investments & retirement · prospective choice';fields='<div class="statusbox warn"><span class="sicon">!</span><div><strong>No enrollment has been recorded</strong><p>Before authoring an actual 401(k) deduction, confirm Rick’s employer plan terms, eligible wages and payroll funding. Do not create an investment account automatically.</p></div></div>';info='You can explore this as a future plan decision, without changing present payroll.';submit='Explore a choice'}
else if(spec==='import'){title='Reviewing an import problem';desc='Settings → Import / Export';fields='<div class="statusbox warn"><span class="sicon">!</span><div><strong>Unsupported format example</strong><p>The source cannot be understood safely. The original financial model stays unchanged. Choose a supported format or enter the missing fact manually.</p></div></div>';info='A candidate import must never silently replace another verified source.';submit='Keep existing data'}
else if(spec==='reset'){title='Discard demo edits?';desc='Prototype-only destructive action';fields='<div class="statusbox warn"><span class="sicon">!</span><div><strong>This would reset the selected fictional household</strong><p>Other demonstration households are not affected. Cancel returns to the same task.</p></div></div>';info='Real model deletion must additionally protect stored data and confirm exact target.';submit='Reset this demo'}
else if(spec==='option'){title='What would this change?';desc='Plan → What If? · hypothetical, not executed';let text=isO()?({earlier:'Both retirement dates would change; healthcare transitions require authoritative dates.',split:'Marisol retires at 62 and James at 67; each income binding is separate.',care:'Future care need would increase from its effective date; public benefit and survivor rules are not assumed.'})[p.option]:({spending:'A future spending assumption decreases $250/month; recorded historical spending stays unchanged.',debt:'A prospective debt repayment requires a valid cash funding source and exact interest/payment schedule.',saving:'A workplace contribution requires enrollment, employer terms, payroll source and statutory capacity.'})[p.option];fields=`<div class="info">${text}</div><div class="statusbox warn" style="margin-top:17px"><span class="sicon">!</span><div><strong>No trustworthy dollar comparison yet</strong><p>Without an independently saved plan and compatible calculation basis, this prototype will not invent a result delta.</p></div></div>`;info='This flow previews the decision; it cannot commit or execute a real-world action.';submit='Understood'}

function submit(){let spec=st.drawer,p=d();const read=id=>{let el=$('f-'+id);return el?(el.value.trim()===''?null:Number(el.value)):null};let vals={};const bad=(s)=>{if($('drawerErr'))$('drawerErr').textContent=s};if(spec==='plan'){let end=read('end'),r=read('ret'),r2=read('ret2');if(end===null||r===null||!Number.isInteger(end)||!Number.isInteger(r)||end<=p.age||end>125)return bad(`Enter a whole-number ending age from ${p.age+1} to 125 and a valid retirement age.`);if(r<=p.age||r>=end)return bad('Retirement age must be in the future and earlier than the chosen forecast end age.');if(isO()&&(r2===null||r2<=p.otherAge||r2>=end))return bad('James needs a separate valid future retirement age before the horizon end.');p.end=end;p.retirement=r;if(isO())p.retirement2=r2;p.forecast='needs';p.changed=true;toast('Planning ages updated in this demo. Prior forecast is now stale; no economic values were calculated.')}else if(['income','card','debt','care'].includes(spec)){let id={income:'earning',card:'card',debt:'mortgage',care:'care'}[spec],v=read(id);if(v===null||!Number.isFinite(v)||v<0||v>10000000)return bad('Enter a valid non-negative amount.');p[id]=v;if(spec==='debt')p.debt=v+(p.auto||0)+(p.card||0)+(isO()?0:1200);if(spec==='card')p.debt=p.mortgage+p.auto+v+1200;p.changed=true;p.forecast='needs';toast('Source updated in demo. Other owner fields were not changed.')}else if(spec==='spend'){let v=read('spend');if(v!==null&&(!Number.isFinite(v)||v<0))return bad('Enter a non-negative amount, or leave unknown.');p.spend=v;p.changed=true;p.forecast='needs';toast('Spending source recorded for this session only.')}else if(spec==='assumptions'){let vals=['infl','wage','return','reserve'].map(read);if(vals.some((v,i)=>v===null||!Number.isFinite(v)||v< (i===2?-50:0)||v> (i===2?100:i===3?60:50)))return bad('Review the entered ranges. Blank suggestions are not silently accepted.');p.changed=true;p.forecast='needs';toast('Illustrative assumptions accepted in this session; no forecast was calculated.')}else if(spec==='first'){go('compare');toast('Reviewing a future choice. No workplace plan was enrolled.')}else if(spec==='reset'){personas[st.persona]=JSON.parse(JSON.stringify(initial[st.persona]));go('overview');toast('The selected fictional demo was reset.')}else if(spec==='import')toast('Existing source data kept. No import was committed.');else if(spec==='option')toast('Decision explained. No actual transaction or computed comparison.');else if(spec==='nav')toast('Navigation menu closed.');st.drawer=null;render()}

().forecast='needs';render();toast('Coverage preview canceled; previous financial facts preserved.')}});

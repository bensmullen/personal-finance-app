<div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">↗</div>Personal Finance<span style="font-size:9px;color:#8ca8a0;font-weight:400;margin-left:-7px">LAB</span></div><div class="s-label">YOUR FINANCES</div><div id="navLeft" class="nav"></div><div class="s-label" style="margin-top:22px">HOW IT WORKS</div><div class="nav"><button class="navbtn" data-nav="sources"><span>◇</span>People &amp; sources</button><button class="navbtn" data-nav="save"><span>▤</span>Save &amp; return</button></div><div class="sidefoot"><strong>Interactive UX pilot</strong><p>Fictional households only. Changes stay on this page; nothing is sent or saved to a financial account.</p></div></aside><div class="main"><header class="topbar"><div class="top-left"><span>PERSONAL PLANNING</span><span>›</span><strong id="crumb">Overview</strong></div><div class="top-actions"><span class="tag">✦ FICTIONAL DATA</span><select class="selectpersona" id="persona" aria-label="Choose demonstration household"><option value="barlow">Rick Barlow · Getting started</option><option value="ortega">Ortega family · Retirement</option></select><div class="themePicker" aria-label="Visual direction"><button data-themebtn="calm" class="on" title="Calm editorial">Calm</button><button data-themebtn="focus" title="Focused compact">Focus</button><button data-themebtn="studio" title="Soft studio">Studio</button></div></div></header><main class="canvas"><div id="screen"></div></main></div></div><nav class="mobileNav" aria-label="Mobile navigation" id="mobileNav"></nav><div id="drawerRoot"></div><div id="toastRoot"></div>
<script>
(function(){
const icons={overview:'⌂',cash:'◫',investing:'◈',property:'⌂',other:'◇',debt:'▣',plan:'◴',compare:'⇄',sources:'◇',save:'▤'};
// The visible section names describe the user's money; existing production fact ownership remains unchanged.
const routes=[['overview','Overview'],['cash','Cash'],['investing','Investing'],['property','Real Estate'],['other','Other Assets'],['debt','Debt'],['plan','Planning']];
const personas={
barlow:{name:'Rick Barlow',subtitle:'Starting with the basics',age:45,retirement:65,retirement2:null,end:90,cash:3950,home:288000,debt:243800,card:5600,mortgage:218000,auto:19000,invest:0,sourceDate:'Oct 2026',earning:72000,care:null,spend:null,changed:false,option:'spending',forecast:'needs',saved:false},
ortega:{name:'The Ortega family',subtitle:'Retirement & lifelong care',age:60,otherAge:61,retirement:65,retirement2:65,end:90,cash:120000,home:1350000,debt:280000,card:0,mortgage:280000,auto:0,invest:3930000,networth:5000000,sourceDate:'Oct 2026',earning:317000,care:3200,spend:null,changed:false,option:'earlier',forecast:'needs',saved:false}}
let st={persona:'barlow',view:'overview',theme:'calm',drawer:null,running:false,subtab:'summary',toastTimer:0,selectedMonth:5,selectedYear:2029,chartMonths:'month',mortgageExtra:0,allocationSelected:0};
let priorFocus=null;const $=id=>document.getElementById(id),d=()=>personas[st.persona],money=n=>typeof n==='number'?'$'+n.toLocaleString('en-US',{maximumFractionDigits:0}):'Not recorded',isO=()=>st.persona==='ortega';
const btn=(txt,action,cls='')=>`<button class="btn ${cls}" data-action="${action}">${txt}</button>`;
const tag=(s,more='')=>`<span class="tag ${more}">${s}</span>`;
const head=(ey,title,sub,buttons='')=>`<div class="head"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p class="lede">${sub}</p></div><div class="head-cta">${buttons}</div></div>`;
const metric=(label,val,desc,ico='↗')=>`<div class="metric"><div class="metric-top"><span>${label}</span><span class="pill">${ico}</span></div><div class="value num">${val}</div><div class="desc">${desc}</div></div>`;
const item=(symbol,title,detail,value,act)=>`<div class="item"><span class="circle">${symbol}</span><div class="itemmain"><strong>${title}</strong><p>${detail}</p></div><div class="itemright">${value?`<span class="num">${value}</span>`:''}<button aria-label="Open ${title}" class="actionlink" data-action="${act}">View <span class="chev">›</span></button></div></div>`;
function nav(){const navHTML=routes.map(([k,v])=>`<button class="navbtn ${st.view===k||(k==='compare'&&st.view==='plan')?'active':''}" data-nav="${k}"><span>${icons[k]}</span>${v}</button>`).join('');$('navLeft').innerHTML=navHTML;const all=[...routes,['compare','Compare plans'],['sources','Household & people'],['save','Save & return']];$('mobileNav').innerHTML=['overview','cash','investing','plan','more'].map(k=>{const [_,l]=all.find(x=>x[0]===k)||[k,'More'];const on=st.view===k||(k==='plan'&&st.view==='compare')||(k==='more'&&['property','other','debt','sources','save'].includes(st.view));return `<button data-${k==='more'?'action':'nav'}="${k==='more'?'open-menu':k}" class="${on?'active':''}"><b>${k==='more'?'☰':icons[k]}</b>${l}</button>`}).join('');$('crumb').textContent=(all.find(x=>x[0]===st.view)||['','Overview'])[1];$('persona').value=st.persona;}
function headerStatus(){return `<div class="statusbox ${d().forecast==='needs'?'warn':''}"><div class="sicon">${d().forecast==='needs'?'!':'✓'}</div><div style="flex:1"><strong>${d().forecast==='needs'?'Future outlook needs a review':'Future outlook is partially modeled'}</strong><p>${d().forecast==='needs'?'Your current finances are still available. Forecast setup and long-term tax coverage need attention.':'Illustrative preview only — no live financial engine is connected to this prototype.'}</p></div><button class="actionlink" data-nav="plan">Review →</button></div>`}
function overview(){let p=d(),o=isO();return head('YOUR STARTING POINT',o?'A clearer picture of your future.':'Know where you stand.',`A simple starting point for ${p.name}. Focus on what matters, then build a plan at your pace.`,btn('Explore your plan →','go-plan','primary')+btn('See monthly cash','go-cash'))+`<div class="primary-viz">${netWorthChart()}</div><div class="metrics">${metric(o?'Household net worth':'Cash & savings',money(o?p.networth:p.cash),o?'Includes home equity; not all available to spend.':'Checking, savings and recorded cash · known facts','KNOWN')}${metric(o?'Investable assets':'Outstanding debt',money(o?p.invest:p.debt),o?'Across multiple accounts, not all immediately accessible.':'Mortgage, car, card and promotional balances','SOURCED')}${metric(o?'Recurring care expense':'Investment accounts',o?money(p.care)+'/mo':'None recorded',o?'Support for Avery · expense, not assumed public benefits.':'No accounts is a valid starting point','VIEW')}</div><div class="grid2"><div class="colstack"><div class="panel"><div class="panelhead"><div><h2>Where should we start?</h2><p>Choose a question. We’ll take you to the right place.</p></div></div>${item('◫',o?'What can we sustainably spend?':'Where does my monthly money go?',o?'Compare recorded income, care needs and expenses.':'Understand income, spending, and payments.',null,'go-money')}${item('▣',o?'How much is accessible?':'What do I actually owe?',o?'Separate liquid money, investments and home equity.':'See the mortgage, vehicle loan and credit card.',null,'go-networth')}${item('◴',o?'What if we retire at different ages?':'Can I start saving for retirement?',o?'See retirement assumptions for each adult.':'Explore the future without needing an investment account.',null,'go-plan')}</div><div class="panel"><div class="panelhead"><div><h2>Current position, explained</h2><p>Recorded financial categories. No future assumptions mixed in.</p></div>${tag('KNOWN VALUES')}</div>${o?`<div class="barrow"><span class="name">Investments</span><div class="barouter"><div class="barfill" style="width:77%"></div></div><span class="v">$3.93m</span></div><div class="barrow"><span class="name">Home</span><div class="barouter"><div class="barfill pale" style="width:27%"></div></div><span class="v">$1.35m</span></div><div class="barrow"><span class="name">Mortgage</span><div class="barouter"><div class="barfill sand" style="width:6%"></div></div><span class="v">$280k</span></div>`:`<div class="barrow"><span class="name">Home</span><div class="barouter"><div class="barfill" style="width:96%"></div></div><span class="v">$288k</span></div><div class="barrow"><span class="name">Debts</span><div class="barouter"><div class="barfill sand" style="width:81%"></div></div><span class="v">$243.8k</span></div><div class="barrow"><span class="name">Cash</span><div class="barouter"><div class="barfill pale" style="width:8%"></div></div><span class="v">$3,950</span></div>`}<div class="footnote">Only recorded components in this fictional example. Bars compare approximate sizes—not spending availability or modeled future returns.</div></div></div><div class="colstack">${headerStatus()}<div class="panel"><div class="panelhead"><div><h2>Your planning starting points</h2><p>Suggestions you can change; not statements of fact.</p></div></div>${item('◴','Forecast through age '+p.end,'Visible, editable planning horizon',null,'go-plan')}${item('↗','Retirement age '+p.retirement,o?'Marisol; James has a separate age.':'Editable assumption, not a benefit claiming age.',null,'edit-plan')}${item('◇','Know what is included','View sources and limitations',null,'go-sources')}</div></div></div>`}
function moneyView(){let p=d();return head('CASH · INCOME & SPENDING','Your cash, coming in and going out.',`Follow account balances, monthly income and spending in one place. Actual bank deposits are never inferred from gross wages.`,btn('Review income','edit-income','primary')+btn('Edit spending','edit-spend'))+`<div class="primary-viz colstack">${cashSeries()}${incomeExpenseChart()}<div id="allocation-detail">${allocationChart()}</div>${demoNote}</div><div class="section-divider"><strong>Accounts, income & spending</strong><span>Source-owned details · edit once</span></div><div class="grid2"><div class="colstack"><div class="panel"><div class="panelhead"><div><h2>Monthly cash flow</h2><p>${p.sourceDate} · Synthetic sources · Not yet reconciled</p></div>${tag('INCOMPLETE','gray')}</div><div class="statusbox warn"><span class="sicon">!</span><div><strong>Take-home pay is not verified</strong><p>Gross wages don’t equal deposits. Add withholding or bank posting evidence to calculate an accurate monthly surplus.</p></div><button class="actionlink" data-action="edit-income">Fix →</button></div>${item('↗','Gross salary',isO()?'Two incomes combined, before payroll withholding.':'Base pay before withholding; excludes some overtime.',money(p.earning/12)+'/mo','edit-income')}${item('◦','Actual take-home deposits','Needs supporting bank/payroll evidence','Unknown','edit-income')}${item('▤','Discretionary spending',p.spend===null?'Not yet recorded for this demo.':'Illustrative entered amount · editable',p.spend===null?'Missing':money(p.spend)+'/mo','edit-spend')}${item('▣','Debt payments','See loan schedules and funding source','See details','go-networth')}${isO()?item('♡','Avery care', 'Recurring parent-funded expense · not a benefit',money(p.care)+'/mo','edit-care'):item('⇄','Sibling support transfer','A bank transfer, not ordinary spending','$100/mo','go-sources')}<div class="footnote">The application would derive a monthly surplus only when deposits and spending are sufficiently reconciled. This static prototype does not calculate financial outcomes.</div></div></div><div class="colstack"><div class="panel"><h2 style="margin-bottom:9px">A useful next step</h2><p class="lede">${isO()?'Confirm who pays care expenses and what coverage is known before projecting retirement.':'Verify monthly deposits and bills, then see whether a debt payoff or first retirement contribution fits.'}</p><div class="callout"><div><h3>Review one source</h3><p>Editing opens the same owner, wherever you start.</p></div>${btn('Go to source →','go-sources','soft')}</div></div><div class="panel"><h2 style="margin-bottom:13px">Accounting, without jargon</h2>${item('✓','A transfer is not new income','Moving money between accounts does not increase wealth.',null,'go-sources')}${item('✓','Loan principal is not consumption','Debt service uses cash but reduces a liability.',null,'go-networth')}</div></div></div>`}
function networthView(){let p=d();return head('DEBT · BORROWING','Understand what you owe.',`Mortgages, auto loans, credit cards and financing remain distinct from the assets they helped purchase.`,btn('Review a debt','edit-debt','primary')+btn('See home & mortgage','go-property'))+`<div class="primary-viz">${debtTrendChart()}</div><div class="metrics">${metric('Home market value',money(p.home),'Source: illustrative property valuation','ASSET')}${metric('Outstanding loan balances',money(p.debt),'Contractual obligations and debt','DEBT')}${metric('Cash & savings',money(p.cash),'Liquid balances, not home equity','CASH')}</div><div class="grid2"><div class="panel"><div class="panelhead"><div><h2>Recorded obligations</h2><p>Tap a debt to see the source and applicable terms.</p></div></div>${item('⌂','Home mortgage',isO()?'3.45% fixed · 7 years left':'5.1% fixed · 21 years left',money(p.mortgage),'edit-debt')}${!isO()?item('▤','Credit card','25% APR · high-interest borrowing',money(p.card),'edit-card'):''}${!isO()?item('▣','Vehicle loan','Used pickup · 9.2% APR',money(p.auto),'edit-debt'):''}${!isO()?item('▣','Promotional financing','Zero percent ends June 2027','$1,200','go-sources'):''}</div><div class="colstack"><div class="panel"><h2 style="margin-bottom:11px">Assets aren’t all spendable</h2><p class="lede">Your home’s value, investment balances, and available cash represent different things.</p><div class="callout"><div><h3>Explore a choice</h3><p>Changes to a hypothetical plan do not rewrite your actual loan.</p></div>${btn('What if?','go-compare','soft')}</div></div><div class="panel"><h2 style="margin-bottom:10px">Source ownership</h2><p class="small muted">Mortgage contract: Net Worth → Debt. Checking/savings balances: Money → Accounts. The same editor is reused when you arrive from a summary or warning.</p></div></div></div>`}
function propertyView(){const p=d();const homeEquity=p.home-p.mortgage;return head('REAL ESTATE · PROPERTY & MORTGAGE','See what the home costs—and builds.',`Property value, mortgage balance and monthly principal versus interest. An extra mortgage payment is a planning choice, not a change to a recorded contract.`,btn('Edit mortgage terms','edit-debt','primary')+btn('Review all debt','go-debt'))+`<div class="primary-viz colstack">${mortgageChart()}${demoNote}</div><div class="metrics">${metric('Estimated property value',money(p.home),'Source: fictional property value','ASSET')}${metric('Mortgage outstanding',money(p.mortgage),'A liability, not a reduction of asset value','DEBT')}${metric('Estimated home equity',money(homeEquity),'Property minus associated mortgage; not additional net worth','DERIVED')}</div><div class="panel"><div class="panelhead"><div><h2>About this property</h2><p>Ownership and loan terms are related, but remain independently sourced.</p></div></div>${item('⌂','Residential property', 'Property value · illustrative source',money(p.home),'go-sources')}${item('▣','Linked mortgage',isO()?'3.45% fixed · 7 years remaining':'5.1% fixed · 21 years remaining',money(p.mortgage),'edit-debt')}<div class="footnote">Actual home equity also depends on any additional liens. Mortgage terms are edited in the single Debt owner editor, accessible here without duplicate entry.</div></div>`}
function otherView(){return head('OTHER ASSETS · PROPERTY','Everything else you own.',`Vehicles, business property and other non-investment assets belong here, not hidden under Investing or counted twice in Real Estate.`,btn('Review ownership & sources','go-sources','primary'))+`<section class="panel primary-viz"><div class="chart-lead"><div><h2>Value over time</h2><p>Recorded values first; attribution appears only when supported purchase, depreciation and valuation sources are available.</p></div>${tag('NO DATA','gray')}</div><div class="graph-empty"><div class="empty-graph-symbol">◇</div><h3>No other assets with a verified value series</h3><p>This preview doesn't fabricate vehicle resale values or business valuations. Once you add a sourced asset, its chart will occupy this position.</p></div></section><div class="panel"><h2>Keep the categories accurate</h2><p class="lede">A financed vehicle is an asset and its auto loan is a separate liability. Property values, cash accounts and securities are shown in their own sections rather than repeated in Other Assets.</p>${btn('View all liabilities','go-debt','soft')}</div>`}
function debtTrendChart(){const p=d(),rows=mortgageRows(),max=p.debt*1.16;let b=axes(max);rows.forEach((r,i)=>{const cx=91+i*30.1,amt=r.balance+(isO()?0:p.card+p.auto+1200),h=amt/max*215;b+=`<rect role="button" tabindex="0" class="chart-click" data-month="${i}" x="${cx-1}" y="${240-h}" width="27" height="${h}" rx="2" fill="${C.teal}" opacity="${i===st.selectedMonth?1:.74}"><title>Illustrative month ${i+1} tracked debt ${fmtK(amt)}</title></rect>`;if(i%3===0)b+=`<text class="chart-axis" x="${cx+11}" y="272" text-anchor="middle">${i+1}</text>`});const r=rows[st.selectedMonth];const rem=r.balance+(isO()?0:p.card+p.auto+1200);return panelchart('Outstanding balances over time','The current mortgage schedule plus separately held loans. Other obligations in this preview remain constant; production will use each debt’s actual model.',svgwrap(b,'Illustrative total liability balances over 24 months')+hexLegend([['Outstanding liabilities',C.teal]])+`<div class="chart-call"><span>Month ${st.selectedMonth+1} · Example balance <b>${fmtK(rem)}</b></span><button class="btn soft smallbtn" data-action="go-property">Open mortgage breakdown →</button></div><p class="chart-note">Do not confuse this chart with expense totals: principal repayment reduces a liability and sends cash out, but isn't consumption expense.</p>`)}
function investingView(){const p=d();return head('INVESTING · ACCOUNTS & HOLDINGS','Understand your invested money.',`Brokerage, retirement accounts and investments live here. Pension and Social Security cash income belong under Planning.`,btn(isO()?'Review retirement ages':'Explore a first step',isO()?'go-plan':'open-first','primary'))+(isO()?`<div class="primary-viz">${attributionChart()}${demoNote}</div><div class="metrics">${metric('Traditional 401(k) balances','$2,550,000','Marisol $1.45m · James $1.10m','OWNED')}${metric('Traditional IRAs','$580,000','Separate owners and tax character','SOURCED')}${metric('Roth IRAs','$410,000','Separate Roth accounts','SOURCED')}</div><div class="grid2"><div class="panel"><div class="panelhead"><div><h2>Retirement & brokerage accounts</h2><p>Manage on the owning account; no duplicate global input.</p></div></div>${item('◈','Marisol · 401(k)','Traditional retirement plan','$1,450,000','open-401k')}${item('◈','James · 401(k)','Separate employer and plan terms','$1,100,000','open-401k')}${item('↗','Taxable brokerage','Joint household ownership','$270,000','go-sources')}</div><div class="panel"><h2>Planning is separate from transactions</h2><p class="lede">A forecast can evaluate retirement choices, but it cannot invent distributions, plan rules or eligibility.</p><div class="callout"><div><h3>Different retirement dates</h3><p>Edit Marisol and James separately.</p></div>${btn('Review plan','go-plan','soft')}</div></div></div>`:`<div class="grid2"><div class="panel"><div class="empty"><div class="glyph">◈</div><h3>No investment accounts recorded</h3><p>That is completely fine. You can still understand debt, spending and savings before deciding whether to invest.</p>${btn('Explore a workplace contribution','open-first','primary')}</div><div class="footnote">Rick's employer offers a plan, but he is not enrolled. An employer match is not presumed to be earned, and workplace deductions must be modeled through payroll.</div></div><div class="panel"><h2 style="margin-bottom:10px">A simpler way to start</h2>${item('1','Make room in the budget','Check actual take-home pay and obligations.',null,'go-money')}${item('2','Understand expensive debt','Review the credit-card APR and payments.',null,'go-networth')}${item('3','Learn about workplace saving','Confirm plan terms and payroll eligibility.',null,'open-first')}</div></div>`)}
function planView(){let p=d(),older=p.age;let years=Math.max(0,p.end-older);let longer=years>40;const retirementLine=isO()?`<div class="inputrow"><div><strong>Marisol · retirement age</strong><p>Planning assumption, separate from benefits</p></div><button class="forminput" data-action="edit-plan">${p.retirement} &nbsp; ✎</button></div><div class="inputrow"><div><strong>James · retirement age</strong><p>Independent event and income binding</p></div><button class="forminput" data-action="edit-plan">${p.retirement2} &nbsp; ✎</button></div>`:`<div class="inputrow"><div><strong>Rick · retirement age</strong><p>Working assumption · not Social Security claiming</p></div><button class="forminput" data-action="edit-plan">${p.retirement} &nbsp; ✎</button></div>`;return head('PLAN → CURRENT PLAN','Look ahead with confidence.',`Your horizon and retirement ages are easy to adjust. Calculations must disclose what they can—and cannot—model.`,btn('Review planning ages','edit-plan','primary')+btn('Compare options','go-compare'))+`<div class="primary-viz">${retirementChart()}${demoNote}</div><div class="grid2"><div class="colstack"><div class="panel"><div class="panelhead"><div><h2>Your planning timeline</h2><p>Suggested end at age 90 · editable · not a death date</p></div>${tag('EDITABLE')}</div><div class="one-line"><span class="muted small">Today · age ${older}</span><strong style="font-size:14px">Through age ${p.end}</strong></div><div class="planbar"></div><div class="planlabels"><span>2026 · starting position</span><span>Retirement ${p.retirement}</span><span>Ending age ${p.end}</span></div><div class="inputrow" style="margin-top:20px"><div><strong>Forecast end age</strong><p>${years} approximate years from the reference adult's current age</p></div><button class="forminput" data-action="edit-plan">${p.end} &nbsp; ✎</button></div>${retirementLine}<div class="footnote">${isO()?"For two selected spouses, the end is the later of their age-90 birthdays. Avery’s care may continue beyond that date; extend deliberately.":"Age 90 is an editable cutoff, not a presumed death date. Retirement age 65 does not mean Social Security benefits start at 65."}</div></div><div class="panel"><div class="panelhead"><div><h2>Illustrative assumptions</h2><p>Planning suggestions, not facts about your returns or salary.</p></div><button class="actionlink" data-action="edit-assumptions">Edit all →</button></div><div class="twocolfacts"><div class="fact"><span>Price growth · nominal</span><b>2.5% / year</b></div><div class="fact"><span>Salary growth · nominal</span><b>3.0% / year</b></div><div class="fact"><span>Generic portfolio return · nominal</span><b>5.0% / year</b></div><div class="fact"><span>Reserve goal</span><b>6 months</b></div></div><div class="footnote">Suggestions do not override authoritative salary, investment contract, tax, Social Security or healthcare facts.</div></div></div><div class="colstack"><div class="panel"><div class="panelhead"><div><h2>Forecast readiness</h2><p>Truthful coverage, without repetitive diagnostics.</p></div></div><div class="statusbox warn"><span class="sicon">!</span><div><strong>${longer?'Requested horizon exceeds current 40-year setup limit':'Not all future outcomes are supported'}</strong><p>${longer?`Age ${p.end} means approximately ${years} years. Existing authoring cannot execute this entire request today.`:'Future-year tax, benefit and healthcare coverage remains conditional on engine support.'}</p></div></div>${isO()?`<div class="statusbox warn"><span class="sicon">↗</span><div><strong>Avery’s care may extend beyond this horizon</strong><p>Care does not end automatically when either parent reaches 90; public benefits cannot be invented.</p></div></div>`:''}${btn(st.running?'Running…':d().forecast==='partial'?'Run illustrative preview again':'See forecast coverage','run-forecast','primary')}${st.running?btn('Cancel run','cancel-forecast') : ''}<div class="footnote">The prototype demonstrates lifecycle and coverage states; it does not compute a financial forecast or ignore unsupported future periods.</div></div><div class="panel"><h2 style="margin-bottom:11px">${d().forecast==='partial'?'Preview: partially modeled':'What could change your outcome?'}</h2><p class="lede">${isO()?'Independent retirement ages, insurance transitions, dependent-care costs and survivor benefits.':'Current spending, expensive debt, workplace plan enrollment, and the start of retirement.'}</p><div class="callout"><div><h3>No false precision</h3><p>Unsupported results remain explicitly uncomputed.</p></div>${btn('Compare choices','go-compare','soft')}</div></div></div></div>`}
function compareView(){let p=d(),o=isO();const choices=o?[['earlier','Retire at 62','Both adults choose earlier retirement; healthcare transitions matter.'],['split','Different retirement dates','Marisol 62, James 67; distinct pay and benefits.'],['care','Higher care funding','Avery’s additional future support; material law gaps.']]:[['spending','Reduce lifestyle spending','Explore a $250/month future reduction; recorded history unchanged.'],['debt','Pay down expensive debt','Explore repaying the card first; funding must be valid.'],['saving','Start a workplace contribution','Requires payroll, enrollment and employer plan terms.']];return head('PLAN → COMPARE','Better decisions, clear tradeoffs.',`Explore alternatives without modifying the real household facts or claiming unsupported financial outcomes.`,btn('Review your plan','go-plan','primary'))+`<div class="grid2"><div class="colstack"><div class="panel"><div class="panelhead"><div><h2>Choose one possible change</h2><p>The baseline remains unchanged. Select an illustrative future decision.</p></div>${tag('PROTOTYPE ONLY','gray')}</div><div class="choicegrid">${choices.map(([k,t,desc])=>`<button class="choice ${p.option===k?'selected':''}" data-option="${k}"><div class="radio">${p.option===k?'◉ SELECTED':'○ OPTION'}</div><h3>${t}</h3><p>${desc}</p></button>`).join('')}</div></div><div class="panel"><div class="panelhead"><div><h2>Comparison preview</h2><p>Two independent plan identities would be required.</p></div></div><div class="twocolfacts"><div class="fact"><span>Original plan</span><b>Baseline</b></div><div class="fact"><span>Selected alternative</span><b>${choices.find(z=>z[0]===p.option)[1]}</b></div></div><div class="statusbox warn" style="margin-top:16px"><span class="sicon">!</span><div><strong>Numeric plan comparison is not calculated here</strong><p>Issue #105 must supply independently saved alternatives and compatible Forecast Basis. Without those, showing a dollar delta or ranking would be misleadi function allocationChart(){const i=st.selectedMonth,p=d();const gross=p.earning/12;const allocations=isO()?[['Payroll taxes · unverified',0,'#d6d7d4'],['401(k) contributions',1000,C.teal],['Mortgage payment',3450,C.navy],['Care costs',1200,C.violet],['Healthcare premium',250,C.sand],['Food',500,C.mint]]:[['Payroll withholding · unknown',0,'#d5d6d0'],['Mortgage payment',1420,C.navy],['401(k)',0,C.teal],['Food',470,C.mint],['Transportation',320,C.sand],['Insurance',310,C.violet]];

function retirementChart(){const o=isO(),start=o?2030:2045,years=Array.from({length:14},(_,i)=>start+i),series=years.map((y,i)=>{const wages=o?(i<4?102000:0):i<1?55000:0,pension=o?34000:0,ss=o?(i<4?0:28000):i<3?0:26000,withdrawal=o?41000+i*2500:18000+i*2000,other=o?15000:0;return {wages,pension,ss,withdrawal,other}}),max=Math.max(...series.map(x=>Object.values(x).reduce((a,b)=>a+b,0)))*1.15;let b=axes(max);series.forEach((r,i)=>{let bottom=240,x=99+i*49;for(let [key,col] of [['wages',C.navy],['pension',C.teal],['ss',C.sand],['withdrawal',C.violet],['other',C.mint]]){let h=r[key]/max*215;b+=`<rect class="chart-click" role="button" tabindex="0" data-year="${years[i]}" x="${x-19}" y="${bottom-h}" width="41" height="${h}" fill="${col}"><title>${years[i]} ${key}: ${fmtK(r[key])} example, choose year</title></rect>`;bottom-=h}if(i%2===0)b+=`<text class="chart-axis" text-anchor="middle" x="${x+2}" y="272">${years[i]}</text>`});const selectedYear=years.includes(st.selectedYear)?st.selectedYear:years[0],row=series[years.indexOf(selectedYear)];return panelchart('Retirement cash received by source','Illustrative incoming streams, with portfolio withdrawals kept distinct from earned income and recognized benefits. Periods start at different retirement ages.',svgwrap(b,'Example stacked yearly retirement cash receipts by source')+hexLegend([['Work income',C.navy],['Pension',C.teal],['Social Security',C.sand],['Portfolio withdrawals',C.violet],['Other',C.mint]])+`<div class="chart-call"><span><b>${selectedYear}</b> · Example cash receipts <b>${fmtK(Object.values(row).reduce((a,b)=>a+b,0))}</b></span><span>Source eligibility not verified</span></div><p class="chart-caution">These are *visual placeholders*, not established benefit eligibility, withdrawal-tax treatment or projected law. Retirement claims, Medicare, survivor benefits and gross/net distinction require capability checks before production amounts can appear.</p>`);

function attributionChart(){let years=Array.from({length:12},(_,i)=>2026+i),base=d().invest||14000,invest=years.map((y,i)=>Math.round(base*(.4+i*.04))),contrib=years.map((y,i)=>Math.round(base*.035*i)),app=years.map((y,i)=>Math.round(base*.02*i*i/10)),max=Math.max(...invest.map((v,i)=>v+contrib[i]+app[i]))*1.15;let b=axes(max);const series=[[invest,C.navy],[contrib,C.teal],[app,C.mint]];let prev=years.map(()=>0);for(let j=0;j<series.length;j++){let [vals,c]=series[j],high=vals.map((v,k)=>v+prev[k]),points=high.map((v,k)=>`${80+k*738/11},${240-v/max*215}`).join(' L'),low=prev.map((v,k)=>`${80+k*738/11},${240-v/max*215}`).reverse().join(' L');b+=`<path d="M${points} L${low} Z" fill="${c}" opacity="${j===0?.85:.75}"/>`;prev=high}years.forEach((y,i)=>{b+=`<text class="chart-axis" text-anchor="middle" x="${80+i*738/11}" y="271">${i%2===0?y:''}</text>`});return panelchart('Why an asset’s value changed','Illustrative stacked area: opening value, subsequent contributions, and market changes. Exact production attribution also needs fees, withdrawals, reinvestment and source valuation lineage.',svgwrap(b,'Example additive asset attribution stacked area, unverified design illustration')+hexLegend([['Illustrative opening value',C.navy],['Illustrative net additions',C.teal],['Illustrative appreciation',C.mint]])+`<div class="chart-disabled"><span class="chart-headnote">DATA CONTRACT PENDING</span><h3>Not yet a computable attribution chart</h3><p>Current forecasts do not establish a complete, reconciled asset-class performance decomposition for every instrument. This preview demonstrates graphical hierarchy only; no component claims are made. In production, unsupported classes show explicit unavailable attribution rather than invented stacks.</p></div><p class="chart-note">A home needs value and debt as separate stocks, principal reduction as financing, and appreciation only when valued. Fees and withdrawals cannot be hidden inside “growth.”</p>`);
}
function tableToggle(columns,rows){return `<details class="chart-table"><summary>View selected chart data as a table</summary><table><thead><tr>${columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></details>`}

function render(){nav();$('screen').innerHTML=({overview,cash:moneyView,debt:networthView,investing:investingView,property:propertyView,other:otherView,plan:planView,compare:compareView,sources:sourcesView,save:saveView}[st.view]||overview)();document.body.dataset.theme=st.theme;$('drawerRoot').innerHTML='';}
function go(k){const aliases={money:'cash',networth:'debt',charts:'overview'};st.view=aliases[k]||k;st.drawer=null;render();window.scrollTo({top:0,behavior:'instant'});}function toast(t){$('toastRoot').innerHTML=`<div role="status" class="toast">${t}</div>`;clearTimeout(st.toastTimer);st.toastTimer=setTimeout(()=>$('toastRoot').innerHTML='',4200)};
function drawer(spec){priorFocus=document.activeElement;st.drawer=spec;const p=d();let title='',desc='',fields='',info='',submit='Save change';const field=(id,label,value,detail,min=0,max=99999999)=>`<label class="f-label" for="f-${id}">${label}</label><input id="f-${id}" name="${id}" type="number" inputmode="decimal" min="${min}" max="${max}" class="forminput" value="${value===null?'':value}" placeholder="Unknown"/><p class="f-description">${detail}</p>`;
if(spec==='nav'){title='All financial sections';desc='Choose a destination. Your current task remains available.';fields='<div class="nav" style="gap:9px">'+[...routes,['sources','People & sources'],['save','Save & return']].map(([k,l])=>'<button type="button" class="btn" data-nav="'+k+'" style="justify-content:flex-start;width:100%">'+icons[k]+' &nbsp; '+l+'</button>').join('')+'</div>';info='All financial sections are available on mobile. Each fact still has one authoritative editor.';submit='Close menu'}else if(spec==='plan'){title='Edit planning ages';desc='Plan → Current Plan and Life Events · separate sources';fields=field('end','Forecast ending age',p.end,'Editable age (up or down). It is a cutoff, not assumed death.',p.age+1,125)+field('ret',''+(isO()?'Marisol':'Rick')+' retirement age',p.retirement,'Illustrative future decision, not Social Security claiming.',p.age+1,100)+(isO()?field('ret2','James retirement age',p.retirement2,'Independent from Marisol. No automatic benefit eligibility.',p.otherAge+1,100):'');info=`For ${p.name}, longer forecasts may exceed current execution limits. The proposed age is never silently truncated.`}
else if(spec==='income'){title='Review income source';desc='Money → Income · authoritative salary editor';fields=field('earning','Annual gross salary',p.earning,'Illustrative recorded gross pay. Actual deposits require payroll and bank evidence.',0,2000000);info='Changing salary does not generate tax withholding, net pay or employer retirement eligibility.'}
else if(spec==='spend'){title='Edit spending source';desc='Money → Spending · actual recurring amount';fields=field('spend','Discretionary spending / month',p.spend,'Only enter a known amount. For a hypothetical reduction, use a separate plan option.',0,500000);info='Unknown is not zero. Saving a blank value preserves missing status.'}
else if(spec==='care'){title='Review care expenses';desc='Money → Spending · payer and supported adult';fields=field('care','Avery care costs / month',p.care,'Parent-funded support expense. Never assume public eligibility or trust outcomes.',0,500000);info='Care spending and separate legal ownership remain independent.'}
else if(spec==='card'){title='Review credit card';desc='Net Worth → Debt · recorded liability';fields=field('card','Card balance',p.card,'Existing balance, not a hypothetical payoff instruction.',0,2000000);info='25% APR is an example card term; modifying the balance does not execute a payment.'}
else if(spec==='debt'){title='Review mortgage source';desc='Net Worth → Debt · contractual obligation';fields=field('mortgage','Current mortgage balance',p.mortgage,'Recorded current balance; not original principal and not home equity.',0,10000000);info='A loan payoff scenario belongs to an independent plan, not a change to this recorded contract.'}
else if(spec==='assumptions'){title='Planning assumptions';desc='Plan → Assumptions · mock suggestions';fields=field('infl','General price growth (%)',2.5,'Nominal illustrative value, not actual CPI or tax law.',0,50)+field('wage','Annual pay growth (%)',3,'Nominal illustrative value; sourced salary contract takes precedence.',0,50)+field('return','Generic portfolio return (%)',5,'Not a guaranteed or observed return.',-50,100)+field('reserve','Emergency reserve target (months)',6,'A goal, not an actual cash balance.',0,60);info='These starter inputs can be changed or omitted. This prototype does not calculate economic consequences.'}
else if(spec==='first'){title='A first workplace contribution';desc='Investments & retirement · prospective choice';fields='<div class="statusbox warn"><span class="sicon">!</span><div><strong>No enrollment has been recorded</strong><p>Before authoring an actual 401(k) deduction, confirm Rick’s employer plan terms, eligible wages and payroll funding. Do not create an investment account automatically.</p></div></div>';info='You can explore this as a future plan decision, without changing present payroll.';submit='Explore a choice'}
else if(spec==='import'){title='Reviewing an import problem';desc='Settings → Import / Export';fields='<div class="statusbox warn"><span class="sicon">!</span><div><strong>Unsupported format example</strong><p>The source cannot be understood safely. The original financial model stays unchanged. Choose a supported format or enter the missing fact manually.</p></div></div>';info='A candidate import must never silently replace another verified source.';submit='Keep existing data'}
else if(spec==='reset'){title='Discard demo edits?';desc='Prototype-only destructive action';fields='<div class="statusbox warn"><span class="sicon">!</span><div><strong>This would reset the selected fictional household</strong><p>Other demonstration households are not affected. Cancel returns to the same task.</p></div></div>';info='Real model deletion must additionally protect stored data and confirm exact target.';submit='Reset this demo'}
else if(spec==='option'){title='What would this change?';desc='Plan → What If? · hypothetical, not executed';let text=isO()?({earlier:'Both retirement dates would change; healthcare transitions require authoritative dates.',split:'Marisol retires at 62 and James at 67; each income binding is separate.',care:'Future care need would increase from its effective date; public benefit and survivor rules are not assumed.'})[p.option]:({spending:'A future spending assumption decreases $250/month; recorded historical spending stays unchanged.',debt:'A prospective debt repayment requires a valid cash funding source and exact interest/payment schedule.',saving:'A workplace contribution requires enrollment, employer terms, payroll source and statutory capacity.'})[p.option];fields=`<div class="info">${text}</div><div class="statusbox warn" style="margin-top:17px"><span class="sicon">!</span><div><strong>No trustworthy dollar comparison yet</strong><p>Without an independently saved plan and compatible calculation basis, this prototype will not invent a result delta.</p></div></div>`;info='This flow previews the decision; it cannot commit or execute a real-world action.';submit='Understood'}
$('drawerRoot').innerHTML=`<div class="overlay" id="shade"><section class="drawer" role="dialog" aria-modal="true" aria-label="${title}"><div class="drawerHead"><div class="one-line"><div class="eyebrow">REVIEW SOURCE</div><button class="btn smallbtn" data-action="cancel-drawer" aria-label="Close editor">✕</button></div><h2 style="font-size:23px;margin-top:8px">${title}</h2><p class="lede" style="font-size:12px;margin-top:8px">${desc}</p></div><form id="drawerForm" class="drawerBody">${fields}<div class="info" style="margin-top:22px">${info}</div><div id="drawerErr" role="alert" class="formerr"></div></form><div class="drawerFoot">${btn('Cancel','cancel-drawer')}${btn(submit,'submit-drawer','primary')}</div></section></div>`;setTimeout(()=>{let input=document.querySelector('#drawerForm input');input?.focus()},20);
}
function submit(){let spec=st.drawer,p=d();const read=id=>{let el=$('f-'+id);return el?(el.value.trim()===''?null:Number(el.value)):null};let vals={};const bad=(s)=>{if($('drawerErr'))$('drawerErr').textContent=s};if(spec==='plan'){let end=read('end'),r=read('ret'),r2=read('ret2');if(end===null||r===null||!Number.isInteger(end)||!Number.isInteger(r)||end<=p.age||end>125)return bad(`Enter a whole-number ending age from ${p.age+1} to 125 and a valid retirement age.`);if(r<=p.age||r>=end)return bad('Retirement age must be in the future and earlier than the chosen forecast end age.');if(isO()&&(r2===null||r2<=p.otherAge||r2>=end))return bad('James needs a separate valid future retirement age before the horizon end.');p.end=end;p.retirement=r;if(isO())p.retirement2=r2;p.forecast='needs';p.changed=true;toast('Planning ages updated in this demo. Prior forecast is now stale; no economic values were calculated.')}else if(['income','card','debt','care'].includes(spec)){let id={income:'earning',card:'card',debt:'mortgage',care:'care'}[spec],v=read(id);if(v===null||!Number.isFinite(v)||v<0||v>10000000)return bad('Enter a valid non-negative amount.');p[id]=v;if(spec==='debt')p.debt=v+(p.auto||0)+(p.card||0)+(isO()?0:1200);if(spec==='card')p.debt=p.mortgage+p.auto+v+1200;p.changed=true;p.forecast='needs';toast('Source updated in demo. Other owner fields were not changed.')}else if(spec==='spend'){let v=read('spend');if(v!==null&&(!Number.isFinite(v)||v<0))return bad('Enter a non-negative amount, or leave unknown.');p.spend=v;p.changed=true;p.forecast='needs';toast('Spending source recorded for this session only.')}else if(spec==='assumptions'){let vals=['infl','wage','return','reserve'].map(read);if(vals.some((v,i)=>v===null||!Number.isFinite(v)||v< (i===2?-50:0)||v> (i===2?100:i===3?60:50)))return bad('Review the entered ranges. Blank suggestions are not silently accepted.');p.changed=true;p.forecast='needs';toast('Illustrative assumptions accepted in this session; no forecast was calculated.')}else if(spec==='first'){go('compare');toast('Reviewing a future choice. No workplace plan was enrolled.')}else if(spec==='reset'){personas[st.persona]=JSON.parse(JSON.stringify(initial[st.persona]));go('overview');toast('The selected fictional demo was reset.')}else if(spec==='import')toast('Existing source data kept. No import was committed.');else if(spec==='option')toast('Decision explained. No actual transaction or computed comparison.');else if(spec==='nav')toast('Navigation menu closed.');st.drawer=null;render()}
const initial=JSON.parse(JSON.stringify(personas));
document.addEventListener('click',e=>{let b=e.target.closest('[data-nav],[data-action],[data-option],[data-themebtn],[data-chart-tab],[data-month],[data-year],[data-chart-toggle],[data-extra],[data-allocation]');if(!b){if(e.target.id==='shade'){st.drawer=null;$('drawerRoot').innerHTML='';priorFocus?.focus?.()}return;}if(b.dataset.nav){go(b.dataset.nav);return}if(b.dataset.chartTab){go('cash');if(b.dataset.chartTab==='allocation')requestAnimationFrame(()=>document.getElementById('allocation-detail')?.scrollIntoView({behavior:'smooth',block:'start'}));return}if(b.dataset.month!==undefined){st.selectedMonth=Number(b.dataset.month);st.selectedYear=2026;render();if(b.dataset.drill==='allocation')requestAnimationFrame(()=>document.getElementById('allocation-detail')?.scrollIntoView({behavior:'smooth',block:'start'}));return}if(b.dataset.year!==undefined){st.selectedYear=Number(b.dataset.year);render();return}if(b.dataset.chartToggle){st.chartMonths=b.dataset.chartToggle;render();return}if(b.dataset.extra!==undefined){st.mortgageExtra=Number(b.dataset.extra);render();return}if(b.dataset.allocation!==undefined){st.allocationSelected=Number(b.dataset.allocation);render();return}if(b.dataset.option){d().option=b.dataset.option;render();return}if(b.dataset.themebtn){st.theme=b.dataset.themebtn;document.querySelectorAll('[data-themebtn]').forEach(z=>z.classList.toggle('on',z.dataset.themebtn===st.theme));document.body.dataset.theme=st.theme;toast('Visual direction: '+{calm:'Calm editorial',focus:'Focused compact',studio:'Soft studio'}[st.theme]);return}const act=b.dataset.action;if(act?.startsWith('go-')){go(act.slice(3));return}if(act==='edit-plan')drawer('plan');if(act==='edit-income')drawer('income');if(act==='edit-spend')drawer('spend');if(act==='edit-debt')drawer('debt');if(act==='edit-card')drawer('card');if(act==='edit-care')drawer('care');if(act==='edit-assumptions')drawer('assumptions');if(act==='open-first'||act==='open-401k')drawer('first');if(act==='open-import')drawer('import');if(act==='open-reset')drawer('reset');if(act==='option-details')drawer('option');if(act==='open-menu')drawer('nav');if(act==='cancel-drawer'){st.drawer=null;$('drawerRoot').innerHTML='';priorFocus?.focus?.()}if(act==='submit-drawer')submit();if(act==='save-session'){d().saved=true;render();toast('Marked as reviewed in this session only — NOT saved to disk or a financial account.')}if(act==='switch-persona'){$('persona').value=st.persona==='barlow'?'ortega':'barlow';$('persona').dispatchEvent(new Event('change'))}if(act==='run-forecast'){if(st.running)return;st.running=true;render();toast('Illustrative coverage check running — no financial engine in this prototype.');setTimeout(()=>{if(!st.running)return;st.running=false;d().forecast='partial';render();toast('Coverage preview complete. Financial projections remain uncomputed and qualified.')},950)}if(act==='cancel-forecast'){st.running=false;d().forecast='needs';render();toast('Coverage preview canceled; previous financial facts preserved.')}});
$('persona').addEventListener('change',e=>{st.persona=e.target.value;st.running=false;go('overview');toast('Switched to fictional '+d().name+'. Other demo remains separate.')});
document.addEventListener('change',e=>{if(e.target.matches('[data-period-select]')){st.selectedMonth=Number(e.target.value);st.allocationSelected=0;render();requestAnimationFrame(()=>document.getElementById('allocation-detail')?.scrollIntoView({block:'start'}))}});
document.addEventListener('keydown',e=>{if(!st.drawer && (e.key==='Enter'||e.key===' ')){const el=e.target.closest('[data-month],[data-year]');if(el){e.preventDefault();el.click();return}}if(!st.drawer)return;if(e.key==='Escape'){st.drawer=null;$('drawerRoot').innerHTML='';priorFocus?.focus?.()}else if(e.key==='Tab'){const root=document.querySelector('.drawer');const els=[...root.querySelectorAll('button,input,select,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled&&el.offsetParent!==null);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();

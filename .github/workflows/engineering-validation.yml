name: engineering-validation

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Heavy evidence profile to execute outside Codex
        required: true
        type: choice
        options:
          - performance
          - stochastic
          - onboarding
          - provider
      warmups:
        description: Performance warmups when profile=performance
        required: false
        default: "2"
      runs:
        description: Performance measured runs when profile=performance
        required: false
        default: "5"

permissions:
  contents: read

concurrency:
  group: engineering-validation-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run selected heavy profile
        env:
          PROFILE: ${{ inputs.profile }}
          PERF_WARMUPS: ${{ inputs.warmups }}
          PERF_RUNS: ${{ inputs.runs }}
        run: |
          case "$PROFILE" in
            performance) SCRIPT=perf:capture ;;
            stochastic) SCRIPT=stochastic:validate ;;
            onboarding) SCRIPT=onboarding:dry-run ;;
            provider) SCRIPT=calibration:integration ;;
            *) echo "Unknown profile: $PROFILE" >&2; exit 2 ;;
          esac
          node -e 'const p=require("./package.json"); const s=process.argv[1]; if(!p.scripts?.[s]){console.error("Profile script is not implemented on this branch:",s);process.exit(3)}' "$SCRIPT"
          npm run "$SCRIPT"
      - name: Record agent process incident
        if: failure()
        env:
          INCIDENT_SURFACE: heavy_validation
          INCIDENT_PROFILE: ${{ inputs.profile }}
          INCIDENT_HEAD: ${{ github.sha }}
          INCIDENT_RUN_ID: ${{ github.run_id }}
          INCIDENT_EVENT: ${{ github.event_name }}
          INCIDENT_REPOSITORY: ${{ github.repository }}
          INCIDENT_GATE_VALIDATE: failure
        run: node tools/ci/write-agent-incident.mjs
      - name: Upload heavy-validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-validation-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            benchmarks/*.json
            engineering-validation-artifacts/**
            .codex/logs/**
          if-no-files-found: ignore
          retention-days: 30

name: fold-architecture-roadmap

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  fold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/alpha-roadmap-after-pr14
      - name: Fold roadmap into governing architecture
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('docs/architecture/system-software-architecture.md')
          text = path.read_text()
          text = text.replace('**Version:** 1.1.0-draft', '**Version:** 1.2.0-draft', 1)

          compiler = r'''## 24.1 Executable Model Compiler

After the Personal-MVP UI milestone, the application layer SHALL contain one authoritative **Executable Model Compiler** boundary between the canonical portable model and executable engine contracts.

Conceptually:

```text
Canonical portable personal model
              │
              ▼
┌─────────────────────────────────────┐
│       Executable Model Compiler     │
│ canonical validation               │
│ reference resolution                │
│ exact value / unit translation      │
│ assumption / primitive binding      │
│ capability diagnostics              │
│                                     │
│ cash-flow compiler ─────────→ VS2   │
│ investment compiler ────────→ VS3   │
│ liability compiler ─────────→ VS4   │
└─────────────────────────────────────┘
              │
              ▼
       Existing financial engine
```

The compiler is an application-layer adapter, not a second financial engine. It SHALL NOT contain independent financial formulas.

Its governing rule is:

> **Compile faithfully or capability-gate. Never guess, silently discard authored semantics, or fabricate defaults.**

Compiler responsibilities include canonical validation required for execution, reference resolution, exact Money/Rate/Quantity/Time construction, binding semantics that are already defined by the specifications, translation to existing engine contracts, lineage/source propagation, and stable typed capability diagnostics.

The compiler SHALL NOT silently choose owners, accounts, currencies, rate bases, timezones, recurrences, funding policies, event meanings, or tax treatments; modify the portable model merely to fit an engine slice; or combine independently executed slice results into a fabricated household forecast.

The UI SHALL continue to depend only on application use cases. Engine modules SHALL NOT depend on the compiler or UI.

'''
          marker = '# 25. Model document, versioning, and compatibility'
          assert marker in text
          text = text.replace(marker, compiler + marker, 1)

          stage48 = r'''# 48. Development maturity stages

## Stage 0 — Financial specification

**Current status:** substantially complete but evolving.

Outputs:

- object model;
- primitive model;
- variable mappings;
- executable semantics.

## Stage 1 — Executable engine

**Current status:** substantially implemented at the slice level, but not yet fully integrated from the canonical Personal Model.

The core engine contains multi-period cash-flow, investment, liability, and deterministic scenario capabilities. Stage 1 is complete only when supported canonical household semantics can reach those capabilities through the Executable Model Compiler without semantic loss.

Goal:

> Given an authoritative canonical household model and scenario, reliably produce deterministic financial state, transactions, statements, explanations, and time-series output.

No production database is required.

## Stage 2 — Personal MVP

**Current status:** UI shell/editor exists after PR 14; functional completion requires PRs 15–21 in Section 53.

Goal:

> The developer can model their actual household, preserve the model, run a useful reconciled long-term projection, inspect/explain results, and compare meaningful scenarios.

Required:

- usable model editor;
- canonical-model → executable-engine compiler;
- multi-period cash-flow, investment, and debt execution from the canonical model;
- authoritative current assets/liabilities/net worth;
- local personal persistence with explicit ADR and recovery/export;
- broader executable scenarios/life-event bindings;
- one reconciled household projection rather than UI aggregation of independent slices;
- charts and scenario comparison;
- actual-versus-forecast boundary;
- visible liquidity-shortfall handling;
- explanation/lineage for material outputs;
- model-version compatibility;
- realistic synthetic Golden Household and critical E2E coverage.

A visually present UI surface SHALL NOT count as implemented when the corresponding canonical model cannot execute the underlying engine capability.

Authentication is optional while the application remains strictly personal/local and is not shared as a multi-user service.

## Stage 3 — Private alpha

Goal:

> Friends and family can each safely maintain their own financial model.

Required:

- authentication;
- PostgreSQL;
- household authorization;
- ownership/access separation;
- backups;
- server-side persistence;
- auditability;
- privacy controls;
- basic monitoring.

Private-alpha work SHALL begin only after the Personal MVP passes the Section 49 functional gate and a personal-use stabilization period has validated usefulness and recoverability.

## Stage 4 — Public production

Adds:

- hardened security;
- support workflows;
- recovery procedures;
- production observability;
- compliance/legal analysis;
- data lifecycle controls;
- infrastructure reliability.

## Stage 5 — Commercial service

Only then consider:

- subscriptions;
- billing;
- bank aggregation at commercial scale;
- formal compliance programs;
- business analytics;
- customer support tooling.

---

'''
          text, n = re.subn(r'# 48\. Development maturity stages\n.*?(?=# 49\. Personal MVP functional gate)', stage48, text, flags=re.S)
          assert n == 1, n

          roadmap = r'''## PR 15 — Executable-model compiler foundation and current-position parity

**Goal:** establish one authoritative canonical-model → executable-engine translation layer and remove the largest false-unavailability gaps in cash flow and current position.

Create the Executable Model Compiler described in Section 24.1. Move PR-14 ad-hoc VS2 translation into this boundary.

Expand canonical → VS2 translation only for semantics already defined by the canonical/executable specifications and implemented by VS2, including where faithfully representable:

- recurring income/expense;
- start/end dates;
- authored income-growth bindings;
- expense inflation/growth bindings;
- supported event-driven start/stop semantics;
- explicit funding-account/policy references;
- exact rate basis and temporal anchors;
- lineage references to source objects/assumptions/events.

Provide authoritative current-position compilation for supported accounts, liabilities, investments/positions, and other assets where current valuation semantics are explicit. Avoid account/position/asset double-counting. Mixed-currency totals remain capability-gated until explicit FX semantics exist.

The synthetic example SHOULD become executable for the supported cash-flow semantics it already authors; do not delete authored semantics merely to satisfy the adapter.

Definition of done:

- one compiler boundary exists and is architecture-enforced;
- supported canonical cash-flow semantics reach VS2 without hidden defaults or semantic loss;
- current Assets and Net Worth work for the synthetic/Golden household where semantically available;
- unsupported semantics return stable typed capability diagnostics;
- compiler-equivalence tests compare compiled runs with direct engine fixtures;
- no financial formula is duplicated in the compiler;
- no reconciled household cross-slice aggregation is introduced.

---

## PR 16 — Canonical liability compiler → VS4

**Goal:** make the Personal-MVP Debt surface execute the existing liability engine.

Compile supported canonical Liability/related configuration into the existing VS4 fixed-amortizing-loan contract.

Initial support SHALL be restricted to already-defined and already-implemented semantics such as fixed-rate monthly loans, explicit rate basis, original/current principal, payment anchor/finite term, scheduled payment, explicit funding policy/account, supported extra-principal payments, and current insufficient-funding behavior.

Expose application read models for balance, contractual payment, interest, scheduled/extra principal, ending principal, outstanding interest, payoff, funding status, liquidity shortfall, and trace references.

Unsupported liability types/rate structures SHALL capability-gate individually rather than disable all debt execution.

Do not add variable-rate/refinance/recast/delinquency semantics unless separately specified.

---

## PR 17 — Canonical investment compiler → VS3

**Goal:** make the Personal-MVP Investments surface execute the existing investment engine.

Compile supported canonical Account/Investment/position/assumption/rule configuration into VS3 for semantics already represented by both the canonical model and existing engine contracts.

Initial support SHOULD cover owned cash/investment accounts, opening positions/quantities/values, internal transfers, contributions/purchases, deterministic returns, market valuation, simple fees/rule bindings, configured funding, exact quantity/rate/rounding behavior, and trace/provenance propagation.

Expose portfolio value, contribution principal, fees, unrealized/realized gains, cash investment income, account values, trace refs, and relevant funding diagnostics.

Avoid double-counting account containers and positions. Do not add stochastic/Monte-Carlo returns.

---

## PR 18 — Personal persistence

**Goal:** make the now-useful Personal MVP durable for actual personal use.

Before implementation, create/approve **ADR-017 — Personal persistence mode**.

The ADR SHALL compare at minimum browser-local structured persistence (e.g. IndexedDB), local file, encrypted local storage/file, and server persistence. For the static Personal MVP, prefer the smallest local-first architecture satisfying documented privacy and recovery requirements.

Unless the ADR identifies a concrete need, do NOT introduce PostgreSQL, authentication, Supabase, or another server solely for this PR.

Required capabilities:

- explicit save/load lifecycle;
- local persistence according to ADR-017;
- model-format compatibility checks and explicit PR-13 migrations on load;
- atomic replacement/recovery so a failed write/migration cannot destroy the last valid model;
- export remains a portable backup mechanism;
- reset/delete-local-data operation;
- session/run settings persistence only if explicitly covered by ADR-017;
- privacy boundary from Section 20;
- E2E save → reload → export/recover coverage.

Persist the portable canonical model, not compiled engine inputs or derived forecast results as new authority.

---

## PR 19 — Broader executable scenarios and life-event bindings

**Goal:** connect the scenario engine and canonical model to the friendly What-If/life-event UX beyond the single PR-14 cash-flow example.

Use the compiler boundary and VS3/VS4 adapters to execute scenario changes already supported by the scenario engine where the base model compiles safely, including income growth, expense inflation, investment return, retirement-date modification, investment purchase changes, extra-principal-payment changes, supported expense/loan funding-policy changes, and fee-rule binding.

Translate canonical Event/Scenario/Assumption references only where semantics are explicit. Preserve configuration/rule/assumption differences and lineage. Do not emulate unsupported stochastic scenarios.

---

## PR 20 — Reconciled household projection/orchestrator

**Goal:** provide one authoritative long-term household projection capable of supporting the Overview financial-outlook and projected-net-worth experience.

This is **not** a UI aggregation PR.

Introduce one engine/application orchestration contract with:

- one opening authoritative household state;
- one run context/horizon;
- one deterministic period ordering;
- cash-flow recognition/settlement ordering;
- investment transfer/purchase/valuation ordering;
- liability accrual/payment ordering;
- explicit funding interactions;
- closing valuation and statements/net worth after all accepted effects;
- no double counting;
- one completed/incomplete status;
- merged trace references without fabricated causality;
- failed-period atomicity;
- deterministic scenario execution.

Do NOT obtain household net worth by summing independently executed VS2/VS3/VS4 result tables. Reuse/refactor existing slice period candidates/common orchestration contracts rather than duplicate their formulas.

Once complete, expose projected household net worth, assets/liabilities, cash/liquidity, investments, debt, shortfalls/milestones, requested-horizon completion, actual/forecast boundary, and reconciled scenario comparison.

---

## PR 21 — Personal-MVP stabilization, explanation, and Golden Household

**Goal:** close the Personal-MVP functional gate before private-alpha infrastructure begins.

Create/upgrade a comprehensive synthetic Golden Household with household/people, employment income with growth, checking/savings, retirement/brokerage holdings and contributions, ordinary expenses with inflation, home/other asset, fixed mortgage, retirement/life event, baseline plus alternative scenarios, and a liquidity-shortfall scenario.

Required work:

- make the synthetic example demonstrate supported functionality rather than avoidable capability gates;
- complete Overview/Money/Net Worth/Plan read models against the reconciled projection;
- replace avoidable generic Unavailable states with precise diagnostics;
- verify every Section 49 Personal-MVP question;
- strengthen explanation using real source/assumption/rule/trace identity without pretending a full causal DAG exists;
- add critical create/load/edit/save/reload/forecast/scenario/explain/export/recover E2E coverage;
- complete a final privacy/recovery review before real personal data is entered.

PR 21 SHALL NOT add PostgreSQL, authentication, or bank connectivity.

---

'''
          text, n = re.subn(r'## PR 15 — Personal persistence\n.*?(?=# 54\. Personal-use stabilization period)', roadmap, text, flags=re.S)
          assert n == 1, n

          stabilization = r'''# 54. Personal-use stabilization period

Only after PRs 15–21 satisfy the Personal-MVP functional gate SHOULD the application become the developer's durable real personal-finance model.

Do not immediately add PostgreSQL, authentication, or bank connectivity.

Use real personal data only within the persistence/privacy boundary approved by ADR-017, keep regular portable exports/backups, and drive subsequent priorities from actual usage.

Record at minimum:

- missing financial concepts;
- incorrect or surprising forecasts;
- unsupported assets/liabilities/accounts;
- confusing UX/workflows;
- unexplained material outputs;
- liquidity/funding cases not handled well;
- scenario limitations;
- persistence/migration/recovery friction;
- performance at realistic horizons;
- required reports.

Distinguish missing financial semantics from UX inconvenience. Prioritize financial correctness and recoverability ahead of feature breadth.

Private-alpha infrastructure begins only after this usage demonstrates that the Personal MVP is genuinely useful.

---

'''
          text, n = re.subn(r'# 54\. Personal-use stabilization period\n.*?(?=# 55\. Private-alpha implementation sequence)', stabilization, text, flags=re.S)
          assert n == 1, n

          nextmilestone = r'''# 62. Next recommended milestone

The immediate next milestone after PR 14 SHALL NOT be persistence, a database, authentication, bank connectivity, another comprehensive UI rewrite, or the reconciled household orchestrator.

The immediate next milestone is:

> **PR 15 — Executable-model compiler foundation and current-position parity.**

Current post-PR14 order:

```text
PR 15  Executable-model compiler foundation + cash/current-position parity
PR 16  Canonical liability compiler → VS4
PR 17  Canonical investment compiler → VS3
PR 18  Personal persistence + ADR-017
PR 19  Broader executable scenarios/life-event bindings
PR 20  Reconciled household projection/orchestrator
PR 21  Personal-MVP stabilization/explanation/Golden Household

THEN
Personal-use stabilization with real data under ADR-017

THEN
Private-alpha PostgreSQL/auth/authorization infrastructure
```

The rationale is dependency order: first make the canonical model faithfully executable against capabilities already present in the engine; then make that useful model durable; then broaden scenarios; then establish a single reconciled household execution authority; then stabilize and validate the Personal MVP before multi-user infrastructure.

---

'''
          text, n = re.subn(r'# 62\. Next recommended milestone\n.*?(?=# 63\. Architectural success criterion)', nextmilestone, text, flags=re.S)
          assert n == 1, n

          path.write_text(text)
          Path('docs/architecture/personal-mvp-alpha-roadmap.md').unlink()
          Path('.github/workflows/fold-architecture-roadmap.yml').unlink()
      - name: Commit folded architecture
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "docs: fold post-PR14 roadmap into architecture"
          git push origin HEAD:docs/alpha-roadmap-after-pr14

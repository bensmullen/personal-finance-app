#:schema https://developers.openai.com/codex/config-schema.json

# Strong default for financial-engine implementation. A per-session model
# selection can still explicitly choose a cheaper model for simpler work.
model = "gpt-5.6"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "low"
model_reasoning_summary = "none"
model_verbosity = "low"

# Guard against accidentally growing always-loaded repository instructions.
project_doc_max_bytes = 16384

# Version-controlled specifications are the durable project memory.
[memories]
use_memories = false
generate_memories = false

# Keep delegation available without allowing token-expensive fan-out.
[agents]
enabled = true
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "low"
interrupt_message = false

# Rewrite only the broad, noisy repository test command. Targeted Vitest
# commands remain untouched during implementation.
[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'node "$(git rev-parse --show-toplevel)/.codex/hooks/quiet-test.mjs"'
timeout = 5
statusMessage = "Applying quiet test policy"
